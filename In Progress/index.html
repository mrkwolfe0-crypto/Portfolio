<!DOCTYPE html>
<!--Universal Header and layout-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width=device-width, initial-scale=1.0">
        <title>Mark Wolfe | Developer Portfolio</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--.container makes a container, .div makes a div-->
        <div class="container">
            <!--Navigation section-->
            <header class="navbar">
                <div class="header">Mark Wolfe</div>
                <nav>
                    <ul>
                        <li><a href="#about">About</a></li>
                        <li><a href="#projects">Projects</a></li>
                    </ul>
                </nav>
            </header>
            <!--Navigation section-->
<!--Universal Header and layout-->
            <!--Hero Section-->
            <section id="about" class="hero-section">
                <h1>Hi I'm <span class="highlight">Mark</span></h1>
                <p>Aspiring Software developer focused on clean architectural and automation. 
                    Exploring languages and how concepts transfer between them.</p>
            </section>
            <!--Hero Section-->
            <!--Dynamic GitHub Project Section, live feed-->
            <section id="projects" class="projects-section">
                <h2>Featured Projects</h2>
                <div class="project-grid" id="dynamic-project-grid">
                    <p class="loading-text">Fetching production repositories from GitHub...</p>
                </div>
            </section>
            <!--Dynamic GitHub Project Section, live feed-->
        </div>
        <script src="app.js"></script>
    </body> 
</html>
