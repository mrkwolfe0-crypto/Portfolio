                    <!--According to the official HTML standard, an <a> element is an inline text link, while a <button> element is an interactive widget.

                    Rule: You cannot nest one interactive element inside another interactive element.

                    When a browser engine parses <a href="..."> <button> ... </button> </a>, it gets confused about user intent:

                    Does a click mean "Follow the link URL"?

                    Or does a click mean "Trigger the button element"?

                    Different browsers handle this illegal nesting unpredictably—some will strip out the <a> tag automatically, others won't trigger the click event properly, and some will cause double-triggering issues.-->
